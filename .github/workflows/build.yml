name: Build release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build app (onedir)
        run: >
          pyinstaller --noconfirm --clean --onedir --noconsole
          --icon assets/icon.ico --name NotchIsland
          --collect-submodules winrt
          --hidden-import winrt.windows.media.control
          --hidden-import winrt.windows.storage.streams
          --hidden-import winrt.windows.ui.notifications
          --hidden-import winrt.windows.ui.notifications.management
          --hidden-import winrt.windows.foundation
          --hidden-import winrt.windows.foundation.collections
          --hidden-import PIL.ImageTk
          notch_island.py

      - name: Self-test exe (gambar semua mode)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\NotchIsland\NotchIsland.exe" -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "selftest timeout" }
          $log = Join-Path $env:APPDATA "NotchIsland\selftest.log"
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "selftest gagal (exit $($p.ExitCode))" }

      - name: Cek modul musik dan notifikasi (winrt)
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath "dist\NotchIsland\NotchIsland.exe" -ArgumentList "--check-winrt" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "check timeout" }
          Get-Content (Join-Path $env:APPDATA "NotchIsland\winrt-check.log")
          if ($p.ExitCode -ne 0) { throw "modul winrt belum lengkap di exe" }

      - name: Versi
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") } else { $v = "0.0.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\NotchIsland.iss

      - name: Zip portable
        shell: pwsh
        run: Compress-Archive -Path dist\NotchIsland -DestinationPath "NotchIsland-portable-${{ steps.ver.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: NotchIsland-${{ steps.ver.outputs.version }}
          path: |
            installer/Output/NotchIslandSetup-*.exe
            NotchIsland-portable-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/NotchIslandSetup-*.exe
            NotchIsland-portable-*.zip
